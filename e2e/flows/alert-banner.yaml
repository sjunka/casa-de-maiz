# A CMS-published topBar alert appears on load and the guest can dismiss it.
appId: ${APP_ID}
---
- runScript: reset-normal.js
- runScript: set-topbar-alert.js
- launchApp:
    clearState: true
- assertVisible:
    id: "alert-banner"
- tapOn: "Descartar alerta"
- assertNotVisible:
    id: "alert-banner"
