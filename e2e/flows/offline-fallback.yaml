# Guest opens Home, load succeeds and is cached. Home then fails on the next
# launch — the last-good content is served, visibly marked as saved (not
# silently stale).
#
# The refresh is a relaunch, not a pull-to-refresh swipe: XCTest's synthesised
# swipe never drives RefreshControl, and a cold launch against a dead API is
# the situation this flow is about anyway.
appId: ${APP_ID}
---
- runScript: reset-normal.js
- launchApp:
    clearState: true
- assertVisible:
    id: "home-success"
- assertNotVisible:
    id: "content-saved-banner"
- runScript: set-home-failing.js
- launchApp
- assertVisible:
    id: "content-saved-banner"
- assertVisible:
    id: "home-success"
